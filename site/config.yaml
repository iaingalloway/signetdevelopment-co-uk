baseURL: https://signetdevelopment.co.uk
locale: en-gb
title: Signet Development
disableKinds:
  - taxonomy
  - term
  - RSS

mediaTypes:
  text/netlify-headers:
    suffixes:
      - ""

outputFormats:
  headers:
    baseName: _headers
    isPlainText: true
    mediaType: text/netlify-headers
    notAlternative: true
    root: true

outputs:
  home:
    - html
    - headers

menu:
  main:
    - name: Expertise
      pageRef: /expertise
      weight: 10
    - name: Work
      pageRef: /work
      weight: 20
    - name: Approach
      pageRef: /approach
      weight: 30
    - name: Insights
      pageRef: /insights
      weight: 40
    - name: About
      pageRef: /about
      weight: 50
    - name: Contact
      pageRef: /contact
      weight: 60

params:
  description: Technical leadership, digital transformation and delivery governance.

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      strikethrough: true
      table: true
      taskList: true
      typographer: true
    parser:
      attribute: true
      autoHeadingID: true
    renderer:
      hardWraps: false
      unsafe: true
      xHTML: false
