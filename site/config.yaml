baseURL: https://signetdevelopment.co.uk
locale: en-gb
title: Signet Development
disableKinds:
  - taxonomy
  - term
  - RSS

mediaTypes:
  text/netlify-headers:
    suffixes:
      - ""

outputFormats:
  headers:
    baseName: _headers
    isPlainText: true
    mediaType: text/netlify-headers
    notAlternative: true
    root: true

outputs:
  home:
    - html
    - headers

params:
  description: Technical leadership, digital transformation, and delivery governance for organisations building and changing critical software systems.

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      strikethrough: true
      table: true
      taskList: true
      typographer: true
    parser:
      attribute: true
      autoHeadingID: true
    renderer:
      hardWraps: false
      unsafe: true
      xHTML: false
